name: Build AAB
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q -o almisbar-android-project.zip -d project
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.14.3' }
      - run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null
      - name: Build (signed with the upload key)
        working-directory: project
        env:
          GH_TOKEN: ${{ github.token }}
          KS_B64: ${{ secrets.KS_B64 }}
          KS_PASSWORD: ${{ secrets.KS_PASSWORD }}
          KS_ALIAS: almisbar
          KS_FILE: almisbar-upload.jks
        run: |
          if [ -z "$KS_PASSWORD" ] || [ -z "$KS_B64" ]; then
            echo "::warning::لا مفتاح في الأسرار: تُبنى نسخة غير موقّعة لتوقيعها خارج GitHub"
            sed -i 's/; signingConfig signingConfigs.release//' app/build.gradle
            gradle :app:bundleRelease :app:assembleRelease --no-daemon
            BT="$ANDROID_HOME/build-tools/36.0.0"
            mkdir -p ../unsigned && cp app/build/outputs/bundle/release/app-release.aab ../unsigned/almisbar-unsigned.aab
            cp app/build/outputs/apk/release/app-release-unsigned.apk ../unsigned/almisbar-unsigned.apk
            cp "$BT/lib/apksigner.jar" "$BT/zipalign" ../unsigned/
            cd .. && gh release delete almisbar-unsigned --yes --cleanup-tag 2>/dev/null || true
            gh release create almisbar-unsigned unsigned/* --title "المسبار — نسخة غير موقّعة (للتوقيع)" --notes "غير صالحة للرفع قبل توقيعها بمفتاح الرفع." --latest=false
            echo "SKIP=1" >> "$GITHUB_ENV"; exit 0
          fi
          echo "$KS_B64" | tr -d ' \r\n' | base64 -d > almisbar-upload.jks || { echo "::error::KS_B64 ليس نصًّا صالحًا"; exit 1; }
          H=$(sha256sum almisbar-upload.jks | cut -c1-12)
          [ "$H" = "acf430858358" ] || { echo "::error::محتوى KS_B64 ناقص أو مختلف عن ملف المفتاح (البصمة $H)"; exit 1; }
          keytool -list -keystore almisbar-upload.jks -storepass "$KS_PASSWORD" >/dev/null 2>&1 || { echo "::error::كلمة السر KS_PASSWORD غير صحيحة لهذا المفتاح"; exit 1; }
          keytool -list -keystore almisbar-upload.jks -storepass "$KS_PASSWORD" -alias almisbar >/dev/null 2>&1 || { echo "::error::المفتاح لا يحوي الاسم almisbar"; exit 1; }
          echo "::notice::المفتاح وكلمة السر سليمان"
          gradle :app:bundleRelease :app:assembleRelease --no-daemon
      - name: Verify signature
        if: env.SKIP != '1'
        working-directory: project
        run: |
          AAB=app/build/outputs/bundle/release/app-release.aab
          jarsigner -verify "$AAB" | tail -1
          keytool -printcert -jarfile "$AAB" | grep -m1 'SHA256:' | tee ../sha256.txt
          grep -E "versionCode|versionName" app/build.gradle | tr -s ' ' | tee ../version.txt
          APK=app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK" | grep -m1 SHA-256
          mkdir -p ../out && cp "$AAB" ../out/almisbar.aab && cp "$APK" ../out/almisbar.apk
      - uses: actions/upload-artifact@v4
        if: env.SKIP != '1'
        with: { name: almisbar-aab, path: out/ }
      - name: Publish latest AAB
        if: env.SKIP != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete almisbar-aab-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create almisbar-aab-latest out/almisbar.aab out/almisbar.apk --title "المسبار — أحدث AAB وAPK" \
            --notes "$(printf 'almisbar.aab للرفع إلى Google Play Console، وalmisbar.apk للتثبيت المباشر، وكلاهما موقّع بمفتاح الرفع.\n\n%s\n\nبصمة الشهادة: %s' "$(cat version.txt)" "$(cat sha256.txt)")"
