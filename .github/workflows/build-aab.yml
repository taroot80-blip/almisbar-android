name: Build AAB
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q -o almisbar-android-project.zip -d project
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.14.3' }
      - run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null
      - name: Build (signed with the upload key)
        working-directory: project
        env:
          KS_B64: ${{ secrets.KS_B64 }}
          KS_PASSWORD: ${{ secrets.KS_PASSWORD }}
          KS_ALIAS: almisbar
          KS_FILE: almisbar-upload.jks
        run: |
          if [ -z "$KS_PASSWORD" ] || [ -z "$KS_B64" ]; then
            echo "::error::مفتاح الرفع غير موجود في أسرار المستودع (KS_B64 / KS_PASSWORD)"; exit 1
          fi
          echo "$KS_B64" | base64 -d > almisbar-upload.jks
          gradle :app:bundleRelease --no-daemon
      - name: Verify signature
        working-directory: project
        run: |
          AAB=app/build/outputs/bundle/release/app-release.aab
          jarsigner -verify "$AAB" | tail -1
          keytool -printcert -jarfile "$AAB" | grep -m1 'SHA256:' | tee ../sha256.txt
          grep -E "versionCode|versionName" app/build.gradle | tr -s ' ' | tee ../version.txt
          mkdir -p ../out && cp "$AAB" ../out/almisbar.aab
      - uses: actions/upload-artifact@v4
        with: { name: almisbar-aab, path: out/ }
      - name: Publish latest AAB
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete almisbar-aab-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create almisbar-aab-latest out/almisbar.aab --title "المسبار — أحدث AAB" \
            --notes "$(printf 'ملف AAB موقّع بمفتاح الرفع، للرفع إلى Google Play Console.\n\n%s\n\nبصمة الشهادة: %s' "$(cat version.txt)" "$(cat sha256.txt)")"
